<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HCMUT Cinema - Select Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --brand-color: #ff3366;
            --brand-gradient: linear-gradient(135deg, #ff3366, #ff7b54);
            --bg-color: #0b0c10;
            --surface-color: #1f2833;
        }
        body {
            background-color: var(--bg-color);
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            overflow: hidden;
        }
        
        /* Background Effects */
        .bg-glow {
            position: absolute;
            width: 40vw;
            height: 40vw;
            background: var(--brand-color);
            filter: blur(100px);
            opacity: 0.15;
            border-radius: 50%;
            z-index: 0;
            animation: pulse 8s infinite alternate;
        }
        .bg-glow:nth-child(2) {
            top: -10%;
            right: -10%;
            background: #ff7b54;
            animation-delay: -4s;
        }
        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.1; }
            100% { transform: scale(1.2); opacity: 0.2; }
        }

        .container {
            position: relative;
            z-index: 10;
            max-width: 900px;
        }

        .brand-title {
            font-size: 3rem;
            font-weight: 800;
            text-align: center;
            margin-bottom: 0.5rem;
            background: var(--brand-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .subtitle {
            text-align: center;
            color: #c5c6c7;
            margin-bottom: 3rem;
            font-size: 1.2rem;
            font-weight: 300;
        }

        .role-cards {
            display: flex;
            gap: 2rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .role-card {
            background: rgba(31, 40, 51, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 3rem 2rem;
            width: 350px;
            text-align: center;
            text-decoration: none;
            color: white;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            position: relative;
            overflow: hidden;
        }

        .role-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 50%;
            height: 100%;
            background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.05) 50%, rgba(255,255,255,0) 100%);
            transform: skewX(-25deg);
            transition: all 0.6s ease;
        }

        .role-card:hover {
            transform: translateY(-10px);
            border-color: rgba(255, 51, 102, 0.3);
            box-shadow: 0 20px 40px rgba(255, 51, 102, 0.15);
            color: white;
        }

        .role-card:hover::before {
            left: 200%;
        }

        .role-card .icon-wrapper {
            width: 100px;
            height: 100px;
            margin: 0 auto 2rem;
            background: rgba(11, 12, 16, 0.8);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            color: var(--brand-color);
            border: 2px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
        }

        .role-card:hover .icon-wrapper {
            background: var(--brand-gradient);
            color: white;
            border-color: transparent;
            transform: scale(1.1);
        }

        .role-card h3 {
            font-size: 1.8rem;
            font-weight: 600;
            margin-bottom: 1rem;
        }

        .role-card p {
            color: #8a8d91;
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 0;
            transition: color 0.3s ease;
        }

        .role-card:hover p {
            color: #d1d3d5;
        }
        
        .role-badge {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 51, 102, 0.1);
            color: var(--brand-color);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
            border: 1px solid rgba(255, 51, 102, 0.2);
        }

        @media (max-width: 768px) {
            .role-cards {
                flex-direction: column;
                align-items: center;
            }
            .role-card {
                width: 100%;
                max-width: 350px;
            }
            .brand-title {
                font-size: 2.2rem;
            }
        }
    </style>
</head>
<body>

    <div class="bg-glow"></div>
    <div class="bg-glow"></div>

    <div class="container">
        <h1 class="brand-title">HCMUT CINEMA</h1>
        <p class="subtitle">Please select your portal to continue</p>
        
        <div class="role-cards">
            <!-- Client Portal -->
            <a href="client.html" class="role-card">
                <span class="role-badge">Customer</span>
                <div class="icon-wrapper">
                    <i class="fas fa-ticket-alt"></i>
                </div>
                <h3>Client Portal</h3>
                <p>Browse movies, book tickets, select seats, and manage your personal bookings in real-time.</p>
            </a>
            
            <!-- Admin Portal -->
            <a href="admin.html" class="role-card">
                <span class="role-badge">Staff</span>
                <div class="icon-wrapper">
                    <i class="fas fa-shield-alt"></i>
                </div>
                <h3>Admin Portal</h3>
                <p>Manage movies, showtimes, user accounts, and view system statistics and revenue.</p>
            </a>
        </div>
    </div>

</body>
</html>
